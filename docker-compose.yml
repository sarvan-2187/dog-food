services:
  db:
    container_name: hackflow-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dogfood
      POSTGRES_PASSWORD: dogfood
      POSTGRES_DB: dogfood
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dogfood -d dogfood"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    container_name: hackflow-api
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://dogfood:dogfood@db:5432/dogfood
      # Empty by default: a random secret is generated on first boot and kept
      # in the keys volume. Set your own in .env to pin it.
      SESSION_SECRET: ${SESSION_SECRET:-}
      FIXTURES_DIR: /app/fixtures
      STATIC_DIR: /app/static
      KEYS_DIR: /app/keys
      UPLOAD_DIR: /app/uploads
      # Fixed sessions for the DOGFOOD acceptance checker (.dogfood.toml), which
      # never logs in. Demo only: delete this line on a real deployment.
      DEMO_SESSION_TOKENS: "demo-org-7f2a=alice@example.com,demo-jdg-a-91bc=tomas.varga@example.org,demo-jdg-b-44de=wei.lindqvist@example.org,demo-prt-2e88=priya1@example.org"
      # Optional password-reset email (PLAN.md Phase 9.3). All empty by
      # default: email stays off and the app makes zero outbound calls. Set
      # them in a .env file next to this one (see .env.example) - never here.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      # Global limit per client (api/app/request_limit.py). 0 switches it off.
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-200}
      # Webhooks may only target public addresses (SSRF guard). 1 allows
      # receivers on the local network.
      WEBHOOK_ALLOW_PRIVATE: ${WEBHOOK_ALLOW_PRIVATE:-}
      # Secure cookies follow APP_BASE_URL (https => secure); 1/0 overrides.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
    ports:
      - "8000:8000"
    volumes:
      - keys_data:/app/keys
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  db_data:
  keys_data:
  uploads_data:
