services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dogfood
      POSTGRES_PASSWORD: dogfood
      POSTGRES_DB: dogfood
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dogfood -d dogfood"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://dogfood:dogfood@db:5432/dogfood
      SESSION_SECRET: dev-only-not-a-real-secret
      FIXTURES_DIR: /app/fixtures
      STATIC_DIR: /app/static
      KEYS_DIR: /app/keys
      UPLOAD_DIR: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      - keys_data:/app/keys
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  db_data:
  keys_data:
  uploads_data:
