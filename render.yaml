# Render Blueprint: free-tier demo deploy (Dashboard > New > Blueprint > this repo).
# Free disk is ephemeral: the signing key and uploads reset on every restart.
# `docker compose up` stays the supported way to run HackFlow.
services:
  - type: web
    name: hackflow
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: hackflow-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Render's edge proxy is the only way in, so trust its X-Forwarded-For:
      # per-client rate limits then key on the real visitor, not the proxy.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      # Set in the dashboard after first deploy, e.g. https://hackflow.onrender.com
      - key: APP_BASE_URL
        sync: false

databases:
  - name: hackflow-db
    plan: free
    region: virginia
