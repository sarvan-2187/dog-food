# Render Blueprint: free-tier demo deploy (Dashboard > New > Blueprint > this repo).
# Free disk is ephemeral: the signing key and uploads reset on every restart.
# `docker compose up` stays the supported way to run HackFlow.
services:
  - type: web
    name: hackflow
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./src/api/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: hackflow-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Render's edge proxy is the only way in and appends the visitor's address
      # to X-Forwarded-For; trust that one hop (the rightmost entry), so per-IP
      # limits key on the real visitor and a client cannot spoof its own.
      - key: TRUST_PROXY_HOPS
        value: "1"
      # Set in the dashboard after first deploy, e.g. https://hackflow.onrender.com
      - key: APP_BASE_URL
        sync: false

databases:
  - name: hackflow-db
    plan: free
    region: virginia
