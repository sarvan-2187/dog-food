  <path d="M16 3 L20 27" stroke="#1F2426" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M24 6 L26 22" stroke="#1F2426" stroke-width="3.4" stroke-linecap="round"/>
</svg>
